name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # fmt, clippy, and the full workspace test suite on two toolchains: the
  # workspace's minimum supported Rust version — after the consolidation it
  # equals the MSRV the generated SQLx 0.9 code needs (1.94) — and stable.
  # The suites that compile generated code (rok-cli's fixture_compile, the
  # module fixtures) print "skipping: generated code needs Rust 1.94" and
  # pass on anything older; the 1.94 job runs them. The PostgreSQL service
  # makes the fixture-app integration suite and the module fixture smoke run
  # execute instead of skipping: the module fixtures create databases, so
  # the role needs CREATEDB, which the service's `postgres` superuser has.
  linux:
    name: Linux (Rust ${{ matrix.rust }}, PostgreSQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.94", stable]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Two databases: the runtime suites reset their schemas and would race
    # the engine's fixture suite on a shared one. The engine's database
    # finds `catalog` on its search path, since the fixture schema names
    # `catalog.products` unqualified.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ROK_DATA_SQLC_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/engine
    steps:
      - name: Create the engine's database
        run: >-
          psql postgres://postgres:postgres@localhost:5432/postgres
          -c 'CREATE DATABASE engine'
          -c 'ALTER DATABASE engine SET search_path = "$user", public, catalog'
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # docs.rs builds rok-data with all features; broken intra-doc links
      # would surface there first — catch them here with the same strictness.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked
      - name: Test (including PostgreSQL and module fixture suites)
        run: cargo test --workspace --all-targets --locked

  # Build and test without PostgreSQL: the database-backed tests print
  # "skipping" and pass when the database URLs are unset.
  cross-platform:
    name: ${{ matrix.os }} (Rust stable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          # The fixture tests run rustfmt --check on the generated code.
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-targets --locked
