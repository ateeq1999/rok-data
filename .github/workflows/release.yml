name: Release

# Publishes the workspace's crates to crates.io with the
# CARGO_REGISTRY_TOKEN repository secret, rok-data-cli last. Binaries and
# the installers are rok-v2's: its `rok` links rok-data-cli, and its
# releases carry the archives (workspace ADR 0032).
#
# Pushing a tag `vX.Y.Z` releases that version: the tag must match the
# workspace's `version` (the single `[workspace.package] version` every
# crate inherits), and CHANGELOG.md must have a `## [X.Y.Z]` section. To
# publish an existing tag again (a run stopped partway), run the workflow
# by hand with that tag; versions already published are skipped.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Fails fast, before any build, when the tag and Cargo.toml disagree or
  # CHANGELOG.md has no section for the version.
  prepare:
    name: Check tag and extract release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the workspace version
        id: version
        run: |
          version="${TAG#v}"
          manifest="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag $TAG does not match the workspace version $manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # Publishes the workspace crates once the tag checks out; a crates.io
  # release can't be taken back. They publish sequentially in
  # dependency order (a parallel matrix would race: publishing rok-data
  # before `rok-data-macros vX` is visible on the registry fails), and a
  # version already on crates.io (a tag run again by hand, or published by
  # hand) is skipped, not an error.
  crates-io:
    name: Publish to crates.io
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the CARGO_REGISTRY_TOKEN repository secret is not set"
            exit 1
          fi
          version="${{ needs.prepare.outputs.version }}"
          # Dependencies first; the CLI crate last so
          # `cargo install rok-data-cli` resolves the published set. rok-templates
          # publishes from its own repository first (workspace ADR 0032).
          for crate in rok-data-macros rok-data-core rok-data rok-data-codegen rok-data-sqlc rok-data-cli; do
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              -A "rok-data release workflow (https://github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/$crate/$version")"
            case "$status" in
              200) echo "::notice::$crate $version is already on crates.io; skipping"
                   continue ;;
              404) ;;
              *)   echo "::error::crates.io answered $status for $crate $version"
                   exit 1 ;;
            esac
            cargo publish --locked -p "$crate"
          done

