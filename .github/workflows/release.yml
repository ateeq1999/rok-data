name: Release

# Builds the rok binary for every supported platform and publishes the
# archives, with SHA-256 checksums, as a GitHub release. The install scripts
# (install.sh, install.ps1) download from these releases. Once the binaries
# build, it also publishes the workspace's library crates to crates.io with
# the CARGO_REGISTRY_TOKEN repository secret, rok-data-cli last (so `cargo
# install rok-data-cli` gets the matching binary).
#
# Pushing a tag `vX.Y.Z` releases that version: the tag must match the
# workspace's `version` (the single `[workspace.package] version` every
# crate inherits), and the release notes are CHANGELOG.md's `## [X.Y.Z]`
# section. To build an existing tag again, run the workflow by hand with
# that tag; it updates the release's assets instead of failing.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Fails fast, before any build, when the tag and Cargo.toml disagree or
  # CHANGELOG.md has no section for the version.
  prepare:
    name: Check tag and extract release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the workspace version
        id: version
        run: |
          version="${TAG#v}"
          manifest="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag $TAG does not match the workspace version $manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds link musl statically, so one binary runs on any
          # distribution regardless of its glibc version. rok-data depends
          # on sqlx without TLS features, so the musl build carries no
          # native TLS library.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="rok-${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rok" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "rok-${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rok.exe" "dist/$name/"
          Copy-Item README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          # Same format as shasum: "<hash>  <file>", LF line ending.
          [IO.File]::WriteAllText("dist/$name.zip.sha256", "$hash  $name.zip`n")
      - name: Smoke test the native binary
        # The x86_64 macOS binary runs under Rosetta on the arm64 runner —
        # make sure Rosetta exists first (the runner image hasn't always
        # shipped it). aarch64 Windows cannot run on the x86_64 runner.
        if: matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] &&
            [ "$(uname -m)" = "arm64" ]; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi
          bin="target/${{ matrix.target }}/release/rok"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir dist
          find artifacts -path '*/dist-*/*' -type f -exec cp {} dist/ \;
          (cd dist && cat ./*.sha256 > SHA256SUMS)
          ls -l dist
      - name: Create or update the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* \
              --title "rok ${{ needs.prepare.outputs.version }}" \
              --notes-file artifacts/release-notes/release-notes.md \
              --verify-tag $prerelease
          fi

  # Publishes the workspace crates once every binary has built, since a
  # crates.io release can't be taken back. They publish sequentially in
  # dependency order (a parallel matrix would race: publishing rok-data
  # before `rok-data-macros vX` is visible on the registry fails), and a
  # version already on crates.io (a tag run again by hand, or published by
  # hand) is skipped, not an error.
  crates-io:
    name: Publish to crates.io
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the CARGO_REGISTRY_TOKEN repository secret is not set"
            exit 1
          fi
          version="${{ needs.prepare.outputs.version }}"
          # Dependencies first; the CLI crate last so
          # `cargo install rok-data-cli` resolves the published set.
          for crate in rok-data-macros rok-data-core rok-data rok-data-codegen rok-data-sqlc rok-data-cli; do
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              -A "rok-data release workflow (https://github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/$crate/$version")"
            case "$status" in
              200) echo "::notice::$crate $version is already on crates.io; skipping"
                   continue ;;
              404) ;;
              *)   echo "::error::crates.io answered $status for $crate $version"
                   exit 1 ;;
            esac
            cargo publish --locked -p "$crate"
          done

  # Installs the published release with the install scripts on each OS, the
  # way a user would, and runs the installed binary.
  verify-install:
    name: Verify install (${{ matrix.os }})
    needs: [prepare, publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          ROK_VERSION: ${{ env.TAG }}
          ROK_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh install.sh
          "$ROK_INSTALL_DIR/rok" --version | grep -F "${{ needs.prepare.outputs.version }}"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ROK_VERSION: ${{ env.TAG }}
          ROK_INSTALL_DIR: ${{ runner.temp }}\bin
          ROK_NO_MODIFY_PATH: "1"
        run: |
          ./install.ps1
          $out = & "$env:ROK_INSTALL_DIR\rok.exe" --version
          Write-Output $out
          if ($out -notlike "*${{ needs.prepare.outputs.version }}*") { exit 1 }
