[workspace]
resolver = "2"
members = [
    "crates/rok-data-core",
    "crates/rok-data-macros",
    "crates/rok-data",
    "crates/rok-data-codegen",


]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ateeq1999/rok-data"
rust-version = "1.94"
homepage = "https://github.com/ateeq1999/rok-data"
authors = ["The rok-data Contributors"]

[workspace.dependencies]
rok-data-core = { path = "crates/rok-data-core", version = "0.1.0" }
rok-data-macros = { path = "crates/rok-data-macros", version = "0.1.0" }
rok-data = { path = "crates/rok-data", version = "0.1.0" }
rok-data-codegen = { path = "crates/rok-data-codegen", version = "0.1.0" }
rok-data-sqlc = { path = "crates/rok-data-sqlc", version = "0.1.0" }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    # Also turns on sqlx-core's `offline`, which is what makes `Executor::describe`
    # exist; rok-data's `Executor` impls rely on it being on.
    "macros",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
