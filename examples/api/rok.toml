# The example's settings: the unified project file (workspace ADR 0011).
# `rok gen` reads it; the flags beat it. See README.md.

[generate]
# The truth dir: the plain `*.sql` files describing the schema. The
# generator reads the truth only; the history dir holds the pairs.
schema = "schema"
# The history dir: the staged migration pairs and their snapshot, which
# `rok gen --migration` writes and `rok migrate` applies.
migrations = "migrations"
# Where the data layer is written.
output = "src/db"
# The generated rows carry serde's derives, and the API features take
# validated bodies through the axum extractor.
derive = ["serde", "validate"]
extractors = ["axum"]

[conventions]
# Every table's id is a UUIDv7 the database fills in.
primary_key_ids = "uuid_v7"
# The columns the database sets, so no request body takes them.
managed_columns = ["created_at", "lent_at"]

[api]
# Where the API features are written.
output = "src/features"
# The features are generated for axum.
framework = "axum"

[api.skip]
# A loan is returned, not deleted.
loans = ["destroy"]

[api.search]
# The list endpoints' `q` matches these columns.
authors = ["name", "email"]
books = ["title"]

[api.sort]
# The list endpoints' `sort` takes these columns.
authors = ["created_at", "email"]
books = ["title"]
