[package]
name = "rok-data-codegen"
description = "Generate a rok-data crate (models, typed queries and migrations) from .sql files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rok-data-codegen"
keywords = ["orm", "codegen", "postgres", "sqlx", "sql"]
categories = ["database", "development-tools"]

[dependencies]
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
quote = "1"
proc-macro2 = "1"
syn = { version = "3", features = ["full"] }
prettyplease = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rok-data = { workspace = true }
sqlx = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true

[dev-dependencies]
rok-data = { path = "../rok-data", features = ["testing", "chrono", "decimal"] }
sqlgen-db = { path = "../../examples/sqlgen/db-gen" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
