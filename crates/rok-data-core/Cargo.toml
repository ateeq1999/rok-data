[package]
name = "rok-data-core"
description = "Core runtime for rok-data: models, query builder, values and connection handling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rok-data-core"
keywords = ["orm", "database", "postgres", "sqlx", "async"]
categories = ["database"]

[features]
default = []
chrono = ["sqlx/chrono"]
uuid = ["sqlx/uuid"]
decimal = ["sqlx/rust_decimal"]
json = ["sqlx/json", "dep:serde", "dep:serde_json"]
migrate = ["sqlx/migrate"]
testing = ["tokio/rt"]
metrics = ["dep:metrics"]
serde = ["dep:serde"]
axum = ["serde", "dep:serde_json", "dep:axum-core", "dep:http"]
ipnetwork = ["dep:ipnetwork", "sqlx/ipnetwork"]
mac_address = ["dep:mac_address", "sqlx/mac_address"]
# `Encrypted` columns: AES-256-GCM under a process-wide key.
encryption = ["dep:aes-gcm", "dep:base64"]
# The pattern rules (`mobile`, `postal_code`, `regex`).
regex = ["dep:regex"]

[dependencies]
sqlx = { workspace = true }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-stream = "0.3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["time", "rt", "sync", "macros"] }
metrics = { version = "0.24", optional = true, default-features = false }
axum-core = { version = "0.5", optional = true, default-features = false }
http = { version = "1", optional = true, default-features = false }
thiserror = "2"
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
ipnetwork = { version = "0.21", optional = true }
mac_address = { version = "1", optional = true }
aes-gcm = { version = "0.10", optional = true, default-features = false, features = ["aes", "alloc", "getrandom"] }
base64 = { version = "0.22", optional = true }
regex = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "builder"
harness = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
