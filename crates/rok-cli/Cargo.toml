[package]
name = "rok-cli"
description = "Single command-line interface for the rok-data database ecosystem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rok-cli"
keywords = ["database", "cli", "orm", "postgres", "migrations"]
categories = ["database", "development-tools", "command-line-utilities"]

[[bin]]
name = "rok"
path = "src/main.rs"

[dependencies]
rok-data = { workspace = true }
rok-data-codegen = { workspace = true }
rok-data-sqlc = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
