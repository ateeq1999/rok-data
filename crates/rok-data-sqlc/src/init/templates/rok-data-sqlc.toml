# Scaffolded once by rok-data-sqlc; this file is yours. It is never regenerated. See docs/guide/architecture.md.
#
# `rok sqlc generate` reads this file: the truth in `schema/` becomes the data
# layer in `src/db/`, and every table an API feature in `src/features/`.
# `rok gen --migration` (the workspace CLI) stages the history pairs into
# `migrations/`, the default history dir.

schema = "schema"
output = "src/db"
derive = ["serde", "validate"]
extractors = ["actix_web"]

[conventions]
primary_key_ids = "uuid_v7"

[api]
output = "src/features"

# Cargo.toml: the skeleton `rok sqlc init` wrote needs these dependencies,
# plus the ones the generated `src/db/mod.rs` lists after `rok sqlc generate`:
#
# [dependencies]
# actix-web = "4"
# jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# serde = { version = "1", features = ["derive"] }
# sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid"] }
# thiserror = "2"
# tracing = "0.1"
# tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# utoipa-swagger-ui = { version = "9", features = ["actix-web", "vendored"] }
# uuid = { version = "1", features = ["v7", "serde"] }
#
# The rules in AGENTS.md forbid unwrap, expect and panic outside tests:
#
# [lints.clippy]
# unwrap_used = "deny"
# expect_used = "deny"
# panic = "deny"
