[package]
name = "rok-data-sqlc-validated-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# The dependencies the generated `src/db/mod.rs` lists, plus tokio to run.
[dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "derive", "rust_decimal"] }
rok-data = { version = "0.5", features = ["decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
rust_decimal = { version = "1", features = ["serde"] }
axum = "0.8"
actix-web = { version = "4", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

# Standalone example crate: not part of the rok-data workspace.
[workspace]

# Until rok-data 0.2 is published, the generated code resolves the
# workspace crate instead of the registry.
[patch.crates-io]
rok-data = { path = "../../../../../crates/rok-data" }
