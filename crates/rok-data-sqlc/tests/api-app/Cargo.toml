[package]
name = "rok-data-sqlc-api-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# An application built the way `rok sqlc init` lays one out (ADR 0016).
# `tests/fixture_compile/` in rok-data-sqlc scaffolds the skeleton with `init`
# and generates `migrations/` into `src/db/`, `src/shared/` and
# `src/features/`, then checks and tests this crate.

# Standalone fixture crate: not part of the rok-data workspace.
[dependencies]
# What the skeleton and the generated API need (`init`'s hints in
# `rok-data-sqlc.toml`, and the generated `src/db/mod.rs`'s).
actix-web = { version = "4", default-features = false, features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# The generated data layer resolves the workspace crate while the release
# pins the published one, so the fixture keeps both the path and the range.
rok-data = { path = "../../../rok-data", version = "0.4", features = ["chrono", "decimal", "ipnetwork", "json", "regex", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnetwork = { version = "0.21", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono", "json", "rust_decimal", "ipnetwork"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["chrono", "decimal", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web", "vendored"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Standalone fixture crate: not part of the rok-data workspace.
[workspace]
