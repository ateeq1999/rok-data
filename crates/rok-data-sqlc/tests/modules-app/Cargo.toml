[package]
name = "rok-data-sqlc-modules-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# The module fixture harness (`tests/module_fixtures/` in rok-data-sqlc)
# generates every module fixture into `src/db/` and checks this crate.

[dependencies]
rok-data = { path = "../../../rok-data", features = ["chrono", "decimal", "json", "uuid"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono", "json", "rust_decimal"] }
uuid = "1"
chrono = "0.4"
serde_json = "1"
rust_decimal = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Standalone fixture crate: not part of the rok-data workspace.
[workspace]
