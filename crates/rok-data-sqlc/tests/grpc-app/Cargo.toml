[package]
name = "rok-data-sqlc-grpc-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# An application generated with `[api] framework = "grpc"` (engine ADR
# 0028): the axum fixture's features, and a table of every type a message
# carries, served as tonic services. `tests/fixture_compile/` in rok
# generates `migrations/` into `src/db/`, `src/shared/`, `src/features/`
# and `proto/`, then checks and tests this crate. `build.rs` compiles
# `proto/` with protox: no `protoc` is installed anywhere.

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"
# The generated data layer resolves the workspace crate while the release
# pins the published one, so the fixture keeps both the path and the range.
rok-data = { path = "../../../rok-data", version = "0.9", features = ["chrono", "decimal", "json", "uuid"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono", "json", "rust_decimal"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-types = "0.14"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"

[dev-dependencies]
# The in-process channel: a duplex pipe between a client and the server.
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }

# Standalone fixture crate: not part of the rok-data workspace.
[workspace]
