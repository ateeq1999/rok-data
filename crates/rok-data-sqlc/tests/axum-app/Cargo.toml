[package]
name = "rok-data-sqlc-axum-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# An application built the way `rok sqlc init` lays one out (ADR 0016), for
# axum: the same feature set as `tests/api-app`, generated for the axum
# backend. `tests/fixture_compile/` in rok-data-sqlc generates `migrations/`
# into `src/db/`, `src/shared/` and `src/features/`, then checks and tests
# this crate.

# Standalone fixture crate: not part of the rok-data workspace.
[dependencies]
# What the skeleton and the generated API need (`init`'s hints in
# `rok-data-sqlc.toml`, and the generated `src/db/mod.rs`'s).
axum = { version = "0.8", features = ["json", "query"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# The generated data layer resolves the workspace crate while the release
# pins the published one, so the fixture keeps both the path and the range.
rok-data = { path = "../../../rok-data", version = "0.4", features = ["chrono", "decimal", "ipnetwork", "json", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The axum extractor of the data layer names serde's path-aware error.
serde_path_to_error = "0.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
utoipa = { version = "5", features = ["chrono", "uuid"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
# The test client: a request through the router, and its body.
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# Standalone fixture crate: not part of the rok-data workspace.
[workspace]
