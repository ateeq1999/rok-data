[package]
name = "rok-templates"
description = "The project templates `rok sqlc init --template` copies: actix-web and axum APIs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rok-templates"
keywords = ["template", "actix-web", "axum", "postgres", "starter"]
categories = ["development-tools", "web-programming"]
# Ship what `build.rs` embeds, not a build or an install of a template
# made in place: the same paths `build.rs` leaves out (`tests/package.rs`
# checks the two agree).
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/templates/**",
    "!/templates/*/target/**",
    "!/templates/**/node_modules/**",
    "!/templates/**/dist/**",
    "!/templates/**/dist-ssr/**",
    "!/templates/**/.output/**",
    "!/templates/**/.tanstack/**",
    "!/templates/**/.vinxi/**",
    "!/templates/**/.wrangler/**",
    "!/templates/**/.DS_Store",
    "!/templates/**/Thumbs.db",
    "!/templates/**/desktop.ini",
    "!/templates/**/.env",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dev-dependencies]
anyhow = "1"
tempfile = "3"

[lints]
workspace = true
