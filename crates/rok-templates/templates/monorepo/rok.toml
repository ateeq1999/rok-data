# The monorepo's project file (workspace ADR 0027): the Apps `rok gen`
# regenerates from the root. Each App keeps its own configuration file --
# `apps/api`'s is `apps/api/rok-data-sqlc.toml` -- so root generation reads
# the App's settings from inside the App. `apps/web` and `apps/desktop` have
# nothing generated yet, so they are not named here.
[apps]
api = "apps/api"
