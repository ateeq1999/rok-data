name: mobile
description: "Cross-platform mobile app using Flutter + flutter_bloc, calling the monorepo's API through its generated Dart client"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Every dependency is pinned to the exact version pubspec.lock resolves
# (workspace ADR 0027), and the gates install with
# `flutter pub get --enforce-lockfile`: bump a version here and in the lock
# together (`flutter pub upgrade <package>`, then pin what it chose).
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9

  # The API: the client `rok gen` generates from apps/api's openapi.json
  # (HTTP calls, models and ApiException). Never edit it; regenerate it.
  api_client:
    path: ../../clients/dart

  # State Management
  flutter_bloc: 9.1.1
  bloc: 9.2.0
  equatable: 2.0.8
  hydrated_bloc: 10.1.1

  # Navigation
  go_router: 15.1.3

  # Storage
  flutter_secure_storage: 10.0.0
  shared_preferences: 2.5.5

  # Forms
  flutter_form_builder: 10.3.0+2
  form_builder_validators: 11.3.0

  # Images
  cached_network_image: 3.4.1
  image_picker: 1.2.1

  # Deep Links
  app_links: 7.0.0

  # Connectivity
  connectivity_plus: 6.1.5

  # Security
  flutter_windowmanager: 0.2.0      # Android FLAG_SECURE to block screenshots

  # Utils
  intl: 0.20.3
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

  # Testing
  http: 1.6.0                       # MockClient: the API answered in tests
  mocktail: 1.0.5
  bloc_test: 10.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
