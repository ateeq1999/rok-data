# Local development: the API with PostgreSQL, Floci (the AWS emulator: S3
# for uploads) and Mailpit (every mail sent, at http://localhost:8025).
#
#   docker compose up --build
#   DATABASE_URL=postgres://app:app@localhost:5432/app rok migrate up
#
# The migrations are applied once, by `rok migrate up`, so its journal knows
# them; the API answers once they are in. With traces and metrics (Jaeger
# at http://localhost:16686, Prometheus at :9091, Grafana at :3000):
#
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 docker compose --profile observability up --build
#
# Every secret here is for local development only.

services:
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      bucket:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      JWT_SECRET: local-development-only-secret-of-at-least-32-bytes
      TOTP_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      APP_URL: http://localhost:8080
      REQUIRE_VERIFIED_EMAIL: "true"
      LOG_FORMAT: pretty
      MAIL_TRANSPORT: smtp
      SMTP_URL: smtp://mailpit:1025
      STORAGE_URL: s3://uploads
      AWS_ENDPOINT: http://floci:4566
      AWS_ALLOW_HTTP: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      # Presigned upload and download URLs are opened by your browser, on
      # the host, not inside this network.
      STORAGE_PUBLIC_ENDPOINT: http://localhost:4566
      METRICS_ADDR: 0.0.0.0:9090
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: api
      SHUTDOWN_DELAY_SECS: "0"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The AWS emulator: S3 for uploads (and SES, Secrets Manager … for
  # `deploy/terraform/envs/local`).
  floci:
    image: floci/floci:2.3.0
    ports:
      - "4566:4566"

  # Creates the uploads bucket once Floci answers, then exits.
  bucket:
    image: amazon/aws-cli:2.39.1
    depends_on:
      - floci
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - sh
      - -c
      - >-
        for attempt in $$(seq 30); do
        aws --endpoint-url http://floci:4566 s3api head-bucket --bucket uploads 2>/dev/null && exit 0;
        aws --endpoint-url http://floci:4566 s3 mb s3://uploads && exit 0;
        sleep 1;
        done; exit 1

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025"

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    volumes:
      - ./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:13.2.5
    profiles: [observability]
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres:
