# The checks every change passes: formatting, lints, the tests against a
# real PostgreSQL, the generated code and the architecture rules, the
# dependency policy, and the image building.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Each test makes a schema of its own in it, and drops it.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The generated code is current, and the architecture rules hold
        run: |
          cargo install rok-data-cli --locked
          rok sqlc g --check
          rok sqlc check-arch

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deny.toml: no known advisory but the ones it lists with a reason,
      # licenses from its allow list, crates from crates.io only.
      - uses: EmbarkStudios/cargo-deny-action@v2

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
